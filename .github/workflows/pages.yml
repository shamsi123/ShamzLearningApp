name: Deploy web app to GitHub Pages
# Retrigger: workflow permissions updated.

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "content/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Build for the project Pages subpath
        run: npm run build
        env:
          # Runs fully offline (local-first): no VITE_API_URL, so no backend is required for this demo.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: SPA fallback so client-side routes survive a hard refresh
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
